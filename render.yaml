services:
  # -----------------------------------------------------------
  # 1. Central Backend API & WebSocket Hub (FastAPI)
  # -----------------------------------------------------------
  - type: web
    name: ai-gpushare-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./gpu_share.db
      - key: SECRET_KEY
        generateValue: true

  # -----------------------------------------------------------
  # 2. Next.js 14 Web Marketplace & Dashboard
  # -----------------------------------------------------------
  - type: web
    name: ai-gpushare-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: ai-gpushare-backend
          property: host
